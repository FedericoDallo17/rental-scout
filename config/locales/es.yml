          title: "Teléfono o tablet Android"
          intro: "Android puede recibir notificaciones directamente desde Chrome sin instalar una aplicación nativa."
          steps:
            - "Abrí Timbre en Chrome e iniciá sesión."
            - "Abrí Avisos y tocá “Activar en este dispositivo”."
            - "Elegí “Permitir” cuando Chrome solicite permiso para enviar notificaciones."
            - "Opcional: usá el menú de tres puntos de Chrome y elegí “Agregar a pantalla principal” o “Instalar aplicación” para acceder más fácilmente."
