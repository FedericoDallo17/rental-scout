            - "Abrí Avisos, hacé clic en “Activar en este dispositivo” y elegí “Permitir”."
            - "Si no aparecen, abrí Configuración del Sistema → Notificaciones → Google Chrome y activá Permitir notificaciones."
        windows:
          title: "PC con Windows"
          intro: "Chrome o Edge pueden mostrar notificaciones de Timbre en Windows aunque el sitio esté cerrado."
          steps:
