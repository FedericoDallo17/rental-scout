            - "Tocá el botón Compartir (el cuadrado con una flecha hacia arriba) en la barra de Safari."
            - "Deslizá hacia abajo, elegí “Agregar a inicio” y luego tocá “Agregar”."
            - "Volvé a la pantalla de inicio y abrí Timbre desde el nuevo ícono."
            - "Abrí Avisos y tocá “Activar en este dispositivo”."
