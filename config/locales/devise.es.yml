      send_instructions: "En unos minutos recibirás un correo con instrucciones para desbloquear tu cuenta."
      send_paranoid_instructions: "Si tu cuenta existe, en unos minutos recibirás instrucciones para desbloquearla."
      unlocked: "Tu cuenta fue desbloqueada correctamente. Iniciá sesión para continuar."
  errors:
    messages:
      already_confirmed: "ya fue confirmado; intentá iniciar sesión"
      confirmation_period_expired: "debe confirmarse dentro de %{period}; solicitá uno nuevo"
      expired: "venció; solicitá uno nuevo"
      not_found: "no encontrado"
      not_locked: "no estaba bloqueado"
      not_saved:
        one: "Un error impidió guardar este %{resource}:"
        other: "%{count} errores impidieron guardar este %{resource}:"
