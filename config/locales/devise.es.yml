      no_token: "No podés acceder a esta página sin llegar desde un correo de restablecimiento de contraseña. Verificá que hayas usado la URL completa."
      send_instructions: "En unos minutos recibirás un correo con instrucciones para restablecer tu contraseña."
      send_paranoid_instructions: "Si tu correo existe en nuestra base de datos, en unos minutos recibirás un enlace para recuperar tu contraseña."
      updated: "Tu contraseña fue modificada correctamente. Ya iniciaste sesión."
      updated_not_active: "Tu contraseña fue modificada correctamente."
    registrations:
      destroyed: "Tu cuenta fue cancelada correctamente. Esperamos verte nuevamente."
      signed_up: "Iniciaste sesión correctamente."
      signed_up_but_inactive: "Te registraste correctamente, pero tu cuenta todavía no está activada."
      signed_up_but_locked: "Te registraste correctamente, pero tu cuenta está bloqueada."
      signed_up_but_unconfirmed: "Enviamos un enlace de confirmación a tu correo. Seguilo para activar tu cuenta."
      update_needs_confirmation: "Actualizaste tu cuenta, pero necesitamos verificar tu nuevo correo. Revisá tu bandeja de entrada y seguí el enlace de confirmación."
      updated: "Tu cuenta fue actualizada correctamente."
      updated_but_not_signed_in: "Tu cuenta fue actualizada, pero como cambiaste la contraseña tenés que iniciar sesión nuevamente."
    sessions:
      signed_in: "Iniciaste sesión correctamente."
      signed_out: "Cerraste sesión correctamente."
      already_signed_out: "Cerraste sesión correctamente."
