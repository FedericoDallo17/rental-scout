    technical_heading: Notas técnicas para evaluar el proyecto
    technical_copy: "Desarrollado con Rails 8, PostgreSQL/PostGIS, Turbo y Solid Queue. Los adaptadores normalizan alquileres en un inventario compartido; las búsquedas privadas determinan coincidencias y notificaciones agrupadas. El producto admite inglés y español. Este recorrido usa datos independientes y nunca ejecuta scrapers."
