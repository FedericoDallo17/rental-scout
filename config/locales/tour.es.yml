        title: Mirá las coincidencias
        copy: "Estos ejemplos respetan el presupuesto que elegiste. La app combina tus búsquedas, explica la afinidad y permite ordenar por novedad, precio o costo mensual. Los presupuestos en UYU y USD se comparan por separado."
