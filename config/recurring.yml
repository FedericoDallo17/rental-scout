development:
  run_scrapers:
    class: RunScrapersJob
    queue: default
    schedule: every hour
  reconcile_scrapers:
    class: RunScrapersJob
    queue: default
    schedule: every Sunday at 3:30am
    args: [{ reconciliation: true }]
  purge_stale_listings:
    class: PurgeStaleListingsJob
    queue: default
    schedule: every day
  backfill_info_casas_coordinates:
    class: BackfillInfoCasasCoordinatesJob
    queue: default
    schedule: every day at 2am
    args: [{ limit: 20 }]

